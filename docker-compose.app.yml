# Local demonstration deployment only. MongoDB is private to this Compose network.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - cti-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  cti-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/
      DATABASE_NAME: ctiSentinelDB
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      ENABLE_LAB_RUNNER: "0"
    ports:
      - "127.0.0.1:5000:5000"
volumes:
  cti-mongo-data:
